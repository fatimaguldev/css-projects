<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavBar Variations</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 2px;
        background-color: #bdbdbd;
      }

      .nav-container {
        margin-bottom: 199px;
      }

      .h2 {
        margin-bottom: 20px;
      }

      .nav1 {
        background-color: #f9f8fa;
        padding: 10px;
      }
      .nav1 ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-between;
      }
      .nav1 li {
        display: inline;
      }
      .nav1 a {
        text-decoration: none;
        color: #2b2b2b;
        /* background-color: #0063c6;*/
        padding: 7px 15px;
        border-radius: 5px;
        position: relative;
      }

      .nav1 a::after {
        content: "abc";
        position: absolute;
        width: 100%;
        bottom: 0;
        left: 0;
        height: 2px;
        background-color: #0060c1;
        transform: scaleX(0);
        transition: 0.3s ease-in-out;
      }
      .nav1 a:hover::after {
        transform: scaleX(1);
      }
      .nav1 .login-btn {
        background-color: #03a816;
        color: #ffffff;
        padding: 8px 15px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
      }
      .nav2 {
        background-color: #2375c6;
        width: 200px;
        padding: 20px;

      }
      .nav2 ul {
        list-style-type: none;
        margin: 00;
        padding: 0;
      }
      .nav2 li {
        margin-bottom: 12px;

      }
      .nav2 a {
        text-decoration: none;
        color: #fff;
        display: block;
        padding: 10px;
        width: 100%;
      }
      .nav2 a:hover {
        background-color: #ffffff;
        color: #000000;
      }
      .nav2 .login-btn {
        background-color: #003a90;
        color: #fff;
        padding: 9px 10px;
        border: none;
        border-radius: 9px;
        width: 100%;
      }
      .nav2 .login-btn:hover {
background-color: #09b412;
color: #fff;
border: 1px solid white;
      }

      .nav3 {
        background-color: hwb(147 1% 34%);
padding: 10px;      }
.nav3 ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
}
.nav3 a {
    text-decoration: none;
    color: #fff;
    padding: 10px;
    display: block;
}
.nav3 .dropdown-content {
    display: none;
}
.nav3 .Dropdown:hover .dropdown-content {
    display: block;
    position: absolute;
    background-color: hwb(147 1% 34%);
   min-width: 170px;
}
.nav3 .login-btn {
    background-color: #fff;
    padding: 10px;
    border: none;
    border-radius: 9px;
    
}
    </style>
  </head>
  <body>
    <div class="nav-container">
      <h2>Variation 1: Horizontal With Underline Effects</h2>
      <nav class="nav1">
        <ul>
          <li>
            <a href="#">Home</a>
          </li>

          <li>
            <a href="#">About</a>
          </li>
          <li>
            <a href="#">Products</a>
          </li>
          <li>
            <button class="login-btn">Login</button>
          </li>
        </ul>
      </nav>
    </div>
    <div class="nav-container">
      <h2>Variation 2: Vertical navbar with hover effect</h2>
      <nav class="nav2">
        <ul>
          <li>
            <a href="#">Home</a>
          </li>
          <li>
            <a href="#">About</a>
          </li>
          <li>
            <a href="#">Portfolio</a>
          </li>
        </ul>
        <button class="login-btn">Login In</button>
      </nav>
    </div>

    <div class="nav-container">
      <h2>Variation 3: Horizontal Navbar with Dropdown</h2>
      <nav class="nav3">
        <ul>
            <li><a href="#">Home</a></li>   
            <li class="Dropdown">
                <a href="#">About</a>
                <div class="dropdown-content">
                    <a href="#">Our Story</a>
                    <a href="#">Team</a>
                    <a href="#">Contact</a>
                </div>
            </li>
          <li><a href="#">Portfolio</a></li>  
          <button class="login-btn">Login</button>
        </ul>
        
      </nav>
    </div>
  </body>
</html>
